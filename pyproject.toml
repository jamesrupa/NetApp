[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netapp"
version = "0.1.0"
description = "Local network analysis & diagnostic toolkit: speed test, network scanner, Wi-Fi scanner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "psutil>=5.9",
    "pyobjc-framework-CoreWLAN>=10; sys_platform == 'darwin' and python_version >= '3.10'",
    "pyobjc-framework-CoreLocation>=10; sys_platform == 'darwin' and python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netapp = "netapp.__main__:main"

[tool.setuptools.packages.find]
include = ["netapp*"]

[tool.setuptools.package-data]
netapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
